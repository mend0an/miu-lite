[package]
name = "miu-lite"
description = "Miu Lite — portable Gemini desktop companion with Miu v0.4, built on the Coucou for Windows code (MIT)"
authors = ["mend0an", "Louis Raille (MIT source code)"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "miu_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "sync", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Same major version as wry, so nothing extra is compiled.
windows = { version = "0.62", features = [
  # Spotify playback state for the dance (media.rs).
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
